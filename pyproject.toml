[project]
name = "bestpractices-library"
version = "0.1.0"
description = "Evidence-based architecture and lifecycle guidance for humans and agents"
requires-python = ">=3.12,<3.14"
dependencies = []

[dependency-groups]
docs = ["mkdocs-material==9.7.7"]
agent = ["mcp==2.3.0"]
dev = ["ruff==0.17.2"]

[tool.uv]
package = false
default-groups = ["docs", "agent", "dev"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
