name: Propose guidance update
on:
  schedule:
    - cron: '43 8 * * 2'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: agent-maintenance
  cancel-in-progress: false
jobs:
  propose:
    if: vars.ENABLE_AGENT_MAINTENANCE == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      base: ${{ github.sha }}
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa
        with:
          version: '0.12.23'
          python-version: '3.12'
      - run: uv sync --frozen
      - run: uv run python -m library.sources check --documents reports/evidence
      - uses: openai/codex-action@c05cfd74ad95c626cdf05c6685e62becc3bf7813
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          codex-version: '0.163.0'
          model: ${{ vars.CODEX_MODEL }}
          permission-profile: ':workspace'
          safety-strategy: drop-sudo
          prompt-file: automation/maintain.md
          output-file: reports/agent-summary.md
      - name: Enforce trusted export boundary
        env:
          BASE_SHA: ${{ github.sha }}
        run: |
          git show "$BASE_SHA:library/agent_gate.py" > "$RUNNER_TEMP/agent-gate.py"
          python "$RUNNER_TEMP/agent-gate.py" "$BASE_SHA"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: agent-proposal
          path: |
            reports/agent.patch
            reports/agent-summary.md
            reports/sources.json
          retention-days: 7
  open-pr:
    needs: propose
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ needs.propose.outputs.base }}
          persist-credentials: false
      - name: Download patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --name agent-proposal --dir reports
      - name: Apply bounded proposal
        run: |
          if [ -s reports/agent.patch ]; then
            git apply --check reports/agent.patch
            git apply reports/agent.patch
          fi
          python -m library.validate
      - uses: peter-evans/create-pull-request@bd09a93810788ce61d2d5fb7d6b221b9b4a4aab7
        with:
          branch: automation/guidance-update
          base: main
          add-paths: |
            docs/
            data/catalog.json
          title: 'docs: proposed evidence-based guidance update'
          commit-message: 'docs: propose reviewed-source guidance changes'
          draft: true
          body: |
            An agent proposed bounded guide/catalog changes from primary evidence.
            A human must inspect source applicability, translation meaning, risks, and revisions.
            The accepted source baseline is unchanged. No automatic merge or approval.
            Run Validate manually on this branch if PR checks were not triggered.
