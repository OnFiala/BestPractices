name: Validate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa
        with:
          version: '0.12.23'
          python-version: '3.12'
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run python -m library.validate
      - run: uv run python -m unittest discover -s tests -v
      - run: node --test tests/webmcp.test.cjs
      - name: Execute bounded local references and record exact inputs
        run: |
          mkdir -p reports
          set +e
          uv run python -m library.verification delivery durable-service agent-workflow \
            frontend-unit frontend-browser --output reports/reference-checks.json \
            > reports/verification.stdout 2> reports/verification.stderr
          result=$?
          cat reports/verification.stdout
          cat reports/verification.stderr >&2
          if [ "$result" -ne 0 ]; then
            uv run python - <<'PY'
          from pathlib import Path
          message = Path('reports/verification.stderr').read_text(errors='replace')[-3500:]
          message = message or 'Reference checks failed; inspect reports/reference-checks.json.'
          message = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::error title=Local reference verification::' + message)
          PY
          fi
          exit "$result"
      - name: Validate scoped observations
        run: uv run python -m library.coverage --report reports/reference-checks.json > reports/coverage.json
      - run: uv run python -m library.site build
      - run: uv run python -m library.check_site
